name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Важно: false — как в официальном шаблоне Pages.
# true + ручная отмена mid-flight клинит очередь deploy-pages
# (deployment_queued / сразу Deployment cancelled).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site

          # Корень сайта = приложение (и / и /anketa.html)
          cp anketa.html _site/index.html
          cp anketa.html _site/anketa.html
          cp anketa.css _site/

          cp lemana-logo.svg _site/
          cp favicon.svg favicon.ico favicon-32.png favicon-48.png apple-touch-icon.png _site/

          cp -R js _site/js
          cp -R vendor _site/vendor

          mkdir -p _site/assets
          cp -R assets/fonts _site/assets/fonts
          mkdir -p _site/assets/icons
          # иконки-ассеты без служебного _preview
          find assets/icons -maxdepth 1 -type f -name '*.svg' -exec cp {} _site/assets/icons/ \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
