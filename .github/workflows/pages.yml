name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site

          # Корень сайта = приложение (и / и /anketa.html)
          cp anketa.html _site/index.html
          cp anketa.html _site/anketa.html
          cp anketa.css _site/

          cp lemana-logo.svg _site/
          cp favicon.svg favicon.ico favicon-32.png favicon-48.png apple-touch-icon.png _site/

          cp -R js _site/js
          cp -R vendor _site/vendor

          mkdir -p _site/assets
          cp -R assets/fonts _site/assets/fonts
          mkdir -p _site/assets/icons
          # иконки-ассеты без служебного _preview
          find assets/icons -maxdepth 1 -type f -name '*.svg' -exec cp {} _site/assets/icons/ \;

      # Обход сломанной очереди actions/deploy-pages (deployment_queued / cancelled).
      # Публикуем статику в ветку gh-pages, Pages читает её как source.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
