<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скринер — Лемана ПРО</title>
  <style>
    :root {
      --green: #146b3a;
      --green-dark: #0d4d2a;
      --green-light: #e9f5ee;
      --orange: #f58a23;
      --ink: #17211b;
      --muted: #66736b;
      --line: #dce5df;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #8a5a00;
      --warning-bg: #fff7d6;
      --surface: #ffffff;
      --background: #f2f6f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #dff2e6 0, transparent 28rem),
        var(--background);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button, input, textarea { font: inherit; }

    .shell {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 21px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      color: white;
      background: var(--green);
      font-size: 23px;
    }

    .saved-count {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.75);
      font-size: 14px;
      white-space: nowrap;
    }

    .progress-wrap {
      display: none;
      margin-bottom: 14px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #dfe8e2;
    }

    .progress > div {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), #2d9a5d);
      transition: width .25s ease;
    }

    .card {
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(20,107,58,.11);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 20px 60px rgba(20, 61, 37, .10);
    }

    h1, h2 { margin-top: 0; line-height: 1.2; }
    h1 { margin-bottom: 14px; font-size: clamp(28px, 5vw, 42px); }
    h2 { margin-bottom: 22px; font-size: clamp(23px, 4vw, 31px); }
    h2.compact-title { font-size: clamp(20px, 3.2vw, 27px); line-height: 1.35; }
    p { line-height: 1.55; }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--green);
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 13px;
    }

    .lead { color: #3f4c44; font-size: 18px; }

    .script {
      margin: 24px 0;
      padding: 20px;
      border-left: 5px solid var(--green);
      border-radius: 0 14px 14px 0;
      background: var(--green-light);
    }

    .script p { margin: 0 0 10px; }
    .script p:last-child { margin-bottom: 0; }

    .instruction {
      margin: -8px 0 20px;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--warning);
      background: var(--warning-bg);
      font-size: 14px;
      font-weight: 600;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--ink);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(20,107,58,.10);
    }

    textarea { min-height: 150px; resize: vertical; }

    .phone-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-prefix {
      padding: 14px 15px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #f6f8f7;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 11px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 16px;
      border: 2px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }

    .option:hover { border-color: #9db7a6; transform: translateY(-1px); }
    .option:has(input:checked) { border-color: var(--green); background: var(--green-light); }
    .option input { flex: 0 0 auto; margin-top: 3px; accent-color: var(--green); }
    .option span { line-height: 1.4; }

    .quota {
      display: block;
      margin-top: 5px;
      color: var(--warning);
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      min-height: 22px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 650;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      min-height: 48px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 750;
      transition: transform .15s, opacity .15s, background .15s;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }
    .primary { color: white; background: var(--green); }
    .primary:hover { background: var(--green-dark); }
    .secondary { color: var(--green-dark); background: var(--green-light); }
    .export { color: white; background: var(--orange); }
    .button:disabled { cursor: not-allowed; opacity: .45; transform: none; }

    .result-icon {
      display: grid;
      width: 74px;
      height: 74px;
      margin-bottom: 20px;
      place-items: center;
      border-radius: 50%;
      font-size: 34px;
      font-weight: 800;
    }

    .success-icon { color: var(--green); background: var(--green-light); }
    .stop-icon { color: var(--danger); background: var(--danger-bg); }
    .result-reason { padding: 14px 16px; border-radius: 12px; background: #f5f7f5; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

    .fineprint {
      margin: 24px 4px 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 20px, 900px); padding-top: 14px; }
      .topbar { align-items: flex-start; }
      .brand { font-size: 17px; }
      .brand-mark { width: 36px; height: 36px; }
      .card { border-radius: 18px; }
      .actions, .result-actions { flex-direction: column-reverse; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">Л</span><span>Скринер «Лемана ПРО»</span></div>
      <div class="saved-count" id="savedCount">Сохранено анкет: 0</div>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta"><span id="stepText"></span><span id="progressPercent"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <section class="card" id="app"></section>
    <div class="fineprint">Данные хранятся только в браузере на этом компьютере.</div>
  </main>

  <script>
    "use strict";

    localStorage.removeItem("lemana_screener_surveys_v1");
    localStorage.removeItem("lemana_screener_surveys_v2");
    const STORAGE_KEY = "lemana_screener_surveys_v3";
    const app = document.getElementById("app");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    const stepText = document.getElementById("stepText");
    const progressPercent = document.getElementById("progressPercent");
    const savedCount = document.getElementById("savedCount");

    const questions = [
      {
        id: "phoneInitial",
        title: "Телефон респондента",
        exportTitle: "Телефон респондента (первичный ввод)",
        type: "phone",
        instruction: "Введите ровно 10 цифр после +7. Для тестовой анкеты введите «тест» или «test».",
        validate: value => /^\d{10}$/.test(value) || ["тест", "test"].includes(value.toLowerCase())
          ? "" : "Введите 10 цифр после +7 либо слово «тест» / «test»."
      },
      {
        id: "gender",
        title: "Пол",
        type: "radio",
        options: ["Мужской", "Женский"]
      },
      {
        id: "age",
        title: "Возраст",
        type: "number",
        instruction: "Допустимый возраст — от 22 до 55 лет включительно.",
        validate: value => Number.isInteger(Number(value)) && Number(value) >= 22 && Number(value) <= 55
          ? "" : "Возраст должен быть целым числом от 22 до 55."
      },
      {
        id: "city",
        title: "Укажите город, в котором Вы зарегистрированы",
        type: "select",
        instruction: "Выберите город из списка. Квота — не более 4 подходящих анкет на каждый город.",
        quota: 4,
        options: [
          "Москва",
          "Санкт-Петербург",
          "Екатеринбург",
          "Казань",
          "Нижний Новгород",
          "Новосибирск",
          "Краснодар",
          "Тюмень",
          "Ростов-на-Дону",
          "Самара"
        ]
      },
      {
        id: "residence",
        title: "Давно ли Вы проживаете в данном городе?",
        type: "radio",
        options: ["Менее 1 года", "1–3 года", "Более 3 лет"],
        terminate: value => value === "Менее 1 года" ? "Проживает в городе менее одного года." : ""
      },
      {
        id: "apartment",
        title: "Когда вы приобрели / получили квартиру, в которой делали ремонт?",
        type: "radio",
        options: ["Менее 12 месяцев назад", "Более 12 месяцев назад"],
        terminate: value => value === "Более 12 месяцев назад" ? "Квартира приобретена более 12 месяцев назад." : ""
      },
      {
        id: "repair",
        title: "Какое из следующих утверждений точнее всего описывает вашу текущую ситуацию с ремонтом?",
        type: "radio",
        options: [
          "Я планирую начать комплексный ремонт в ближайший месяц",
          "Я сейчас делаю мелкий косметический ремонт (переклеить обои, заменить розетки)",
          "Я сейчас нахожусь в процессе комплексного / капитального ремонта своего жилья",
          "Я полностью завершил(а) мелкий косметический ремонт",
          "Я полностью завершил(а) комплексный ремонт, включая меблировку",
          "Я полностью завершил(а) комплексный ремонт, сейчас в процессе меблировки"
        ],
        terminate: value => [
          "Я планирую начать комплексный ремонт в ближайший месяц",
          "Я сейчас делаю мелкий косметический ремонт (переклеить обои, заменить розетки)",
          "Я сейчас нахожусь в процессе комплексного / капитального ремонта своего жилья",
          "Я полностью завершил(а) мелкий косметический ремонт"
        ].includes(value) ? "Текущая стадия ремонта не соответствует критериям отбора." : ""
      },
      {
        id: "repairFor",
        title: "Для кого вы делали этот ремонт?",
        type: "radio",
        instruction: "Квоты: 7 человек — для себя / семьи; 3 человека — для аренды / продажи.",
        options: [
          { label: "Для себя / своей семьи", quota: 7 },
          { label: "Для сдачи квартиры в аренду / на продажу (флиппинг)", quota: 3 },
          "Это моя работа, я делаю ремонты на заказ клиентам"
        ],
        terminate: value => value === "Это моя работа, я делаю ремонты на заказ клиентам"
          ? "Респондент занимается ремонтами на заказ." : ""
      },
      {
        id: "decisions",
        title: "Кто принимал решения о дизайне, выборе материалов и подрядчиков?",
        type: "radio",
        instruction: "Квоты: по 5 человек в каждой категории.",
        options: [
          { label: "Принимал решение и делал всё полностью сам (с семьей)", quota: 5 },
          { label: "Принимал решение совместно с привлеченным профи (дизайнером / прорабом)", quota: 5 }
        ]
      },
      {
        id: "stores",
        title: "В каких магазинах вы совершали покупки для текущего ремонта?",
        type: "checkbox",
        instruction: "Зачитайте список. Можно выбрать несколько вариантов. Если не выбрана «Лемана ПРО», интервью нужно закончить.",
        options: [
          "Петрович",
          "Лемана ПРО (бывший Леруа Мерлен)",
          "Лента Дом (бывший ОБИ)",
          "Максидом",
          "Бауцентр",
          "Строительные рынки",
          "Маркетплейсы (Ozon, Wildberries, Яндекс.Маркет)"
        ],
        terminate: value => value.includes("Лемана ПРО (бывший Леруа Мерлен)")
          ? "" : "Респондент не совершал покупок в «Лемана ПРО» для текущего ремонта."
      },
      {
        id: "loyalty",
        title: "Есть ли у вас оформленная программа лояльности магазина «Лемана ПРО»?",
        type: "radio",
        subtitle: "Скидочная или бонусная карта «Лемана ПРО» (ранее «Леруа Мерлен»).",
        options: ["Да", "Нет"],
        terminate: value => value === "Нет" ? "У респондента нет программы лояльности «Лемана ПРО»." : ""
      },
      {
        id: "family",
        title: "Расскажите немного о вашей семье и о том, кто будет жить или уже живет в этой квартире",
        type: "textarea",
        subtitle: "Уточните: есть ли дети, планируются ли, один человек или пара."
      },
      {
        id: "purchaseStory",
        title: "Какова предыстория покупки этой квартиры? Что стало главным стимулом для приобретения?",
        type: "textarea",
        subtitle: "Например: расширение из-за детей, переезд от родителей, надоело снимать, наследство или вложение денег."
      },
      {
        id: "initialCondition",
        title: "В каком состоянии была квартира в момент покупки и насколько серьезные работы пришлось проводить?",
        type: "textarea",
        subtitle: "Например: бетонная коробка, White Box, вторичка со старым ремонтом под переделку или квартира с отделкой."
      },
      {
        id: "callback",
        title: "Большое спасибо за информацию. Я передаю вашу анкету в отдел координации проекта. Сейчас коллеги обрабатывают все заявки и составляют итоговый график встреч. В случае подтверждения мы свяжемся с вами в ближайшее время, чтобы окончательно зафиксировать время интервью. Вы не против, если мы вам перезвоним?",
        type: "radio",
        compactTitle: true,
        options: ["Да, можно перезвонить", "Нет, не нужно перезванивать"]
      },
      {
        id: "phone",
        title: "Повторно введите телефон респондента",
        exportTitle: "Телефон респондента (повторный ввод)",
        type: "phone",
        matchInitialPhone: true,
        instruction: "Телефон должен совпадать с номером, указанным в начале анкеты.",
        validate: value => /^\d{10}$/.test(value) || ["тест", "test"].includes(value.toLowerCase())
          ? "" : "Введите 10 цифр после +7 либо слово «тест» / «test»."
      }
    ];

    let currentIndex = 0;
    let answers = {};
    let startedAt = "";

    function loadSurveys() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch (_) {
        return [];
      }
    }

    function saveSurveys(surveys) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(surveys));
      updateSavedCount();
    }

    function updateSavedCount() {
      const count = loadSurveys().length;
      savedCount.textContent = "Сохранено анкет: " + count;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function optionLabel(option) {
      return typeof option === "string" ? option : option.label;
    }

    function isTestPhone(value) {
      return ["тест", "test"].includes(String(value || "").trim().toLowerCase());
    }

    function normalizePhone(value) {
      return isTestPhone(value) ? "__test__" : String(value || "").trim();
    }

    function isTestSurvey() {
      return isTestPhone(answers.phoneInitial) || isTestPhone(answers.phone);
    }

    function quotaCount(questionId, value) {
      return loadSurveys().filter(item =>
        item.status === "Подходит" &&
        !item.isTest &&
        item.answers &&
        item.answers[questionId] === value
      ).length;
    }

    function finalQuotaFailure() {
      if (isTestSurvey()) return "";

      for (const question of questions) {
        const value = answers[question.id];
        if (question.quota && quotaCount(question.id, value) >= question.quota) {
          return `Квота по городу «${value}» уже заполнена (${question.quota} из ${question.quota}).`;
        }

        const selectedOption = question.options?.find(option =>
          typeof option === "object" && option.label === value
        );
        if (selectedOption?.quota && quotaCount(question.id, value) >= selectedOption.quota) {
          return `Квота по выбранной категории уже заполнена (${selectedOption.quota} из ${selectedOption.quota}).`;
        }
      }
      return "";
    }

    function intro() {
      progressWrap.style.display = "none";
      app.innerHTML = `
        <div class="eyebrow">Анкета для отбора участников</div>
        <h1>Проведение ремонта</h1>
        <p class="lead">Перед началом зачитайте респонденту информацию об исследовании.</p>
        <div class="script">
          <p>Здравствуйте, Вас беспокоит сотрудник компании «Лемана ПРО». Мы работаем над улучшением программы лояльности и проводим встречи с покупателями, чтобы честно обсудить, что нам стоит улучшить. Хотели бы пригласить Вас к обсуждению темы «Проведение ремонта».</p>
          <p>Это не коммерческое предложение. Менеджеры по продажам участвовать не будут — нам важно только ваше независимое мнение.</p>
          <p>Встреча займет около одного часа онлайн в программе Zoom. За участие предусмотрено вознаграждение — 5000 баллов на вашу карту лояльности.</p>
        </div>
        <h2>Вам было бы интересно поделиться опытом?</h2>
        <div class="actions">
          <button class="button export" id="exportFromStart">Выгрузить в Excel</button>
          <button class="button secondary" id="declineIntro">Нет</button>
          <button class="button primary" id="startButton">Да, начать анкету</button>
        </div>
      `;
      document.getElementById("startButton").onclick = startNew;
      document.getElementById("exportFromStart").onclick = exportXlsx;
      document.getElementById("declineIntro").onclick = () => {
        answers = { interest: "Нет" };
        startedAt = new Date().toISOString();
        finish("Прервано", "Респондент не заинтересован в участии.");
      };
    }

    function startNew() {
      answers = { interest: "Да" };
      startedAt = new Date().toISOString();
      currentIndex = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[currentIndex];
      progressWrap.style.display = "block";
      const percent = Math.round(((currentIndex + 1) / questions.length) * 100);
      stepText.textContent = `Вопрос ${currentIndex + 1} из ${questions.length}`;
      progressPercent.textContent = percent + "%";
      progressBar.style.width = percent + "%";

      let control = "";
      const previous = answers[question.id];

      if (question.type === "radio" || question.type === "checkbox") {
        const inputType = question.type;
        control = `<div class="options">` + question.options.map((option, index) => {
          const label = optionLabel(option);
          const checked = inputType === "checkbox"
            ? (Array.isArray(previous) && previous.includes(label))
            : previous === label;
          let quota = "";
          if (typeof option === "object" && option.quota) {
            const used = quotaCount(question.id, label);
            quota = `<small class="quota">Квота: ${used} из ${option.quota}</small>`;
          }
          return `
            <label class="option">
              <input type="${inputType}" name="answer" value="${escapeHtml(label)}" ${checked ? "checked" : ""}>
              <span>${escapeHtml(label)}${quota}</span>
            </label>`;
        }).join("") + `</div>`;
      } else if (question.type === "phone") {
        control = `
          <label class="field-label" for="answer">Номер телефона</label>
          <div class="phone-row">
            <span class="phone-prefix">+7</span>
            <input id="answer" type="text" maxlength="10" autocomplete="off"
              value="${escapeHtml(previous || "")}" placeholder="9991234567 или test">
          </div>`;
      } else if (question.type === "number") {
        control = `<input id="answer" type="number" min="22" max="55" step="1"
          value="${escapeHtml(previous || "")}" placeholder="Например, 35">`;
      } else if (question.type === "select") {
        control = `<select id="answer">
          <option value="">Выберите город</option>
          ${question.options.map(option => {
            const used = quotaCount(question.id, option);
            return `<option value="${escapeHtml(option)}" ${previous === option ? "selected" : ""}>${escapeHtml(option)} — ${used} из ${question.quota}</option>`;
          }).join("")}
        </select>`;
      } else if (question.type === "textarea") {
        control = `<textarea id="answer" placeholder="Введите ответ респондента">${escapeHtml(previous || "")}</textarea>`;
      } else {
        control = `<input id="answer" type="text" value="${escapeHtml(previous || "")}" placeholder="Введите ответ">`;
      }

      app.innerHTML = `
        <div class="eyebrow">Вопрос ${currentIndex + 1}</div>
        ${question.preface ? `<div class="script"><p>${escapeHtml(question.preface)}</p></div>` : ""}
        <h2 class="${question.compactTitle ? "compact-title" : ""}">${escapeHtml(question.title)}</h2>
        ${question.subtitle ? `<p class="lead">${escapeHtml(question.subtitle)}</p>` : ""}
        ${question.instruction ? `<div class="instruction">${escapeHtml(question.instruction)}</div>` : ""}
        ${control}
        <div class="error" id="error" role="alert"></div>
        <div class="actions">
          <button class="button secondary" id="backButton">${currentIndex === 0 ? "К началу" : "Назад"}</button>
          <button class="button primary" id="nextButton">${currentIndex === questions.length - 1 ? "Завершить" : "Далее"}</button>
        </div>`;

      document.getElementById("backButton").onclick = goBack;
      document.getElementById("nextButton").onclick = goNext;

      const textInput = document.getElementById("answer");
      if (textInput) {
        textInput.focus();
        textInput.addEventListener("keydown", event => {
          if (event.key === "Enter" && question.type !== "textarea") goNext();
        });
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function readAnswer(question) {
      if (question.type === "radio") {
        return document.querySelector('input[name="answer"]:checked')?.value || "";
      }
      if (question.type === "checkbox") {
        return [...document.querySelectorAll('input[name="answer"]:checked')].map(input => input.value);
      }
      return document.getElementById("answer").value.trim();
    }

    function goBack() {
      const question = questions[currentIndex];
      answers[question.id] = readAnswer(question);
      if (currentIndex === 0) {
        intro();
      } else {
        currentIndex--;
        renderQuestion();
      }
    }

    function goNext() {
      const question = questions[currentIndex];
      const value = readAnswer(question);
      const empty = Array.isArray(value) ? value.length === 0 : value === "";
      const error = document.getElementById("error");

      if (empty) {
        error.textContent = "Выберите или введите ответ.";
        return;
      }

      if (question.validate) {
        const message = question.validate(value);
        if (message) {
          error.textContent = message;
          return;
        }
      }

      if (question.matchInitialPhone && normalizePhone(value) !== normalizePhone(answers.phoneInitial)) {
        error.textContent = "Телефон не совпадает с номером, указанным в начале анкеты.";
        return;
      }

      answers[question.id] = value;

      if (question.terminate) {
        const reason = question.terminate(value);
        if (reason) {
          finish("Прервано", reason);
          return;
        }
      }

      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        const quotaFailure = finalQuotaFailure();
        if (quotaFailure) {
          finish("Прервано", quotaFailure);
          return;
        }
        finish("Подходит", "Анкета успешно заполнена. Респондент соответствует критериям отбора.");
      }
    }

    function finish(status, reason) {
      const surveys = loadSurveys();
      const isTest = isTestSurvey();
      const record = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
        startedAt: startedAt || new Date().toISOString(),
        completedAt: new Date().toISOString(),
        status,
        reason,
        isTest,
        answers: typeof structuredClone === "function"
          ? structuredClone(answers)
          : JSON.parse(JSON.stringify(answers))
      };
      surveys.push(record);
      saveSurveys(surveys);

      progressWrap.style.display = "none";
      const success = status === "Подходит";
      app.innerHTML = `
        <div class="result-icon ${success ? "success-icon" : "stop-icon"}">${success ? "✓" : "×"}</div>
        <div class="eyebrow">${success ? "Анкета завершена" : "Интервью прервано"}</div>
        <h1>${success ? "Респондент подходит" : "Отбор завершён"}</h1>
        <p class="result-reason">${escapeHtml(reason)}</p>
        ${isTest ? `<div class="instruction">Тестовая анкета — она не учитывается в общих квотах.</div>` : ""}
        <p>Ответы сохранены в браузере. Всего сохранено анкет: <strong>${surveys.length}</strong>.</p>
        <div class="result-actions">
          <button class="button primary" id="newSurvey">Начать заново</button>
          <button class="button export" id="exportSurveys">Выгрузить данные в Excel</button>
        </div>`;

      document.getElementById("newSurvey").onclick = intro;
      document.getElementById("exportSurveys").onclick = exportXlsx;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function xmlEscape(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

    function columnName(number) {
      let result = "";
      while (number > 0) {
        number--;
        result = String.fromCharCode(65 + (number % 26)) + result;
        number = Math.floor(number / 26);
      }
      return result;
    }

    function makeSheetXml(rows) {
      const sheetRows = rows.map((row, rowIndex) => {
        const cells = row.map((value, columnIndex) => {
          const ref = columnName(columnIndex + 1) + (rowIndex + 1);
          const text = Array.isArray(value) ? value.join("; ") : String(value ?? "");
          return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(text)}</t></is></c>`;
        }).join("");
        return `<row r="${rowIndex + 1}">${cells}</row>`;
      }).join("");
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
        `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
        `<sheetData>${sheetRows}</sheetData></worksheet>`;
    }

    function littleEndian(number, bytes) {
      const output = [];
      for (let index = 0; index < bytes; index++) {
        output.push(number & 255);
        number = Math.floor(number / 256);
      }
      return output;
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xFFFFFFFF;
      for (const byte of bytes) crc = crcTable[(crc ^ byte) & 255] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function createZip(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;

      for (const file of files) {
        const name = encoder.encode(file.name);
        const data = encoder.encode(file.content);
        const crc = crc32(data);
        const local = new Uint8Array([
          ...littleEndian(0x04034b50, 4),
          ...littleEndian(20, 2),
          ...littleEndian(0x0800, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(crc, 4),
          ...littleEndian(data.length, 4),
          ...littleEndian(data.length, 4),
          ...littleEndian(name.length, 2),
          ...littleEndian(0, 2),
          ...name
        ]);
        chunks.push(local, data);

        central.push(new Uint8Array([
          ...littleEndian(0x02014b50, 4),
          ...littleEndian(20, 2),
          ...littleEndian(20, 2),
          ...littleEndian(0x0800, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(crc, 4),
          ...littleEndian(data.length, 4),
          ...littleEndian(data.length, 4),
          ...littleEndian(name.length, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 2),
          ...littleEndian(0, 4),
          ...littleEndian(offset, 4),
          ...name
        ]));
        offset += local.length + data.length;
      }

      const centralSize = central.reduce((sum, item) => sum + item.length, 0);
      const end = new Uint8Array([
        ...littleEndian(0x06054b50, 4),
        ...littleEndian(0, 2),
        ...littleEndian(0, 2),
        ...littleEndian(files.length, 2),
        ...littleEndian(files.length, 2),
        ...littleEndian(centralSize, 4),
        ...littleEndian(offset, 4),
        ...littleEndian(0, 2)
      ]);
      return new Blob([...chunks, ...central, end], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
    }

    function exportXlsx() {
      const surveys = loadSurveys();
      if (!surveys.length) {
        alert("Нет сохранённых анкет для выгрузки.");
        return;
      }

      const headers = [
        "ID анкеты", "Начало", "Завершение", "Статус", "Причина завершения",
        "Тестовая анкета", "Интерес к участию",
        ...questions.map(question => question.exportTitle || question.title)
      ];
      const rows = [headers];
      for (const survey of surveys) {
        rows.push([
          survey.id,
          new Date(survey.startedAt).toLocaleString("ru-RU"),
          new Date(survey.completedAt).toLocaleString("ru-RU"),
          survey.status,
          survey.reason,
          survey.isTest ? "Да" : "Нет",
          survey.answers?.interest || "",
          ...questions.map(question => survey.answers?.[question.id] ?? "")
        ]);
      }

      const files = [
        {
          name: "[Content_Types].xml",
          content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
            `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
            `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
            `<Default Extension="xml" ContentType="application/xml"/>` +
            `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
            `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
            `</Types>`
        },
        {
          name: "_rels/.rels",
          content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
            `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
            `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
            `</Relationships>`
        },
        {
          name: "xl/workbook.xml",
          content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
            `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ` +
            `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
            `<sheets><sheet name="Анкеты" sheetId="1" r:id="rId1"/></sheets></workbook>`
        },
        {
          name: "xl/_rels/workbook.xml.rels",
          content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
            `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
            `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>` +
            `</Relationships>`
        },
        { name: "xl/worksheets/sheet1.xml", content: makeSheetXml(rows) }
      ];

      const blob = createZip(files);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `Анкеты_Лемана_${date}.xlsx`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    updateSavedCount();
    intro();
  </script>
</body>
</html>
