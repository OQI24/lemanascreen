<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFBF2F">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E2426">
  <meta name="description" content="Офлайн-скринер для отбора участников исследования Лемана ПРО.">
  <meta name="application-name" content="Скринер Лемана ПРО">
  <title>Лемана ПРО · Скринер респондентов</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180">
  <link rel="stylesheet" href="anketa.css">
</head>
  <body>
  <a class="skip-link" href="#app">К анкете</a>
  <main class="shell">
    <div class="topbar">
      <button type="button" class="brand" id="brandHome" title="К началу" aria-label="К началу анкеты">
        <img src="lemana-logo.svg?v=2" alt="Лемана ПРО" width="120" height="31">
      </button>
      <div class="topbar-side">
        <div class="saved-count" id="savedCount" title="Данные хранятся только в браузере на этом компьютере">Сохранено анкет: 0</div>
        <div class="topbar-tools" id="topbarTools">
          <div class="service-menu" id="serviceMenu">
            <button type="button" class="service-toggle" id="serviceToggle" aria-expanded="false" aria-haspopup="true">Сервис</button>
            <div class="service-dropdown" role="menu" id="serviceDropdown">
              <button type="button" class="service-item" id="exportFromStart" role="menuitem">Выгрузить в Excel</button>
              <button type="button" class="service-item" id="importFromStart" role="menuitem">Загрузить Excel</button>
              <div class="service-base-block">
                <div class="service-base-btn-wrap" id="clientBaseBtnWrap">
                  <button type="button" class="service-item service-base-btn" id="loadClientBaseBtn" role="menuitem">Подключить базу</button>
                  <button type="button" class="service-base-clear" id="clearClientBaseBtn" title="Очистить базу клиентов" aria-label="Очистить базу клиентов" hidden></button>
                  <div class="service-base-progress" id="clientBaseProgress" hidden>
                    <div class="service-base-progress-bar" id="clientBaseProgressBar"></div>
                  </div>
                </div>
              </div>
              <button type="button" class="service-switch" id="copyModeToggle" role="menuitemcheckbox" aria-checked="false">
                <span>Упрощённые текстовки</span>
                <span class="switch-track" aria-hidden="true"></span>
              </button>
              <button type="button" class="service-switch" id="quotasToggle" role="menuitemcheckbox" aria-checked="false">
                <span>Показать квоты</span>
                <span class="switch-track" aria-hidden="true"></span>
              </button>
              <button type="button" class="service-item danger" id="resetShiftStart" role="menuitem">Очистить данные анкет</button>
            </div>
          </div>
          <input type="file" id="importFileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <input type="file" id="clientBaseFileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
        </div>
      </div>
    </div>

    <div class="shell-stage">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta"><span id="stepText"></span><span id="progressPercent"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <section class="card" id="app"></section>
    </div>
  </main>

  <div class="quotas-scrim" id="quotasScrim" hidden></div>
  <aside class="quotas-panel" id="quotasPanel" hidden>
    <div class="quotas-panel-head">
      <h2 class="quotas-panel-title">Квоты</h2>
      <button type="button" class="quotas-panel-close" id="quotasPanelClose" title="Закрыть" aria-label="Закрыть панель квот"></button>
    </div>
    <div class="quotas-panel-body" id="quotasPanelBody"></div>
  </aside>

  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/anketa.js"></script>
</body>
</html>
